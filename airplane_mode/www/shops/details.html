<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop Details</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/picnic" />
  <style>
    :root {
      --primary: #ffffff;
      --secondary: #3498db;
      --bg-dark: #0a0a0a;
      --bg-card: #1a1a1a;
      --text-light: #e0e0e0;
      --border-radius: 10px;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      line-height: 1.6;
      color: var(--text-light);
      background-color: var(--bg-dark);
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    .shop-header {
      background: var(--secondary);
      color: white;
      padding: 2rem;
      border-radius: var(--border-radius);
      margin-bottom: 2rem;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.5);
    }

    .shop-details {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.5rem;
    }

    .detail-card {
      background: var(--bg-card);
      padding: 1.5rem;
      border-radius: var(--border-radius);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.6);
      border-left: 4px solid var(--secondary);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .detail-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.8);
    }

    .detail-card h2 {
      color: var(--primary);
      margin-top: 0;
      font-size: 1.1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .detail-card p {
      font-size: 1.4rem;
      margin: 0.5rem 0 0;
      color: var(--secondary);
      font-weight: bold;
    }

    .success {
      color: #2ecc71;
    }

    .error {
      color: #e74c3c;
    }

    @media (max-width: 600px) {
      .shop-details {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <header class="shop-header">
      <h1>Shop Details</h1>
    </header>

    <section class="shop-details">
      <article class="detail-card">
        <h2>Shop Name</h2>
        <p>{{ shop_name }}</p>
      </article>

      <article class="detail-card">
        <h2>Airport</h2>
        <p>{{ airport }}</p>
      </article>

      <article class="detail-card">
        <h2>Area</h2>
        <p>{{ area }}</p>
      </article>

      <article class="detail-card">
        <h2>Location</h2>
        <p>{{ location }}</p>
      </article>

      <article class="detail-card">
        <h2>Status</h2>
        <p class="{% if status == 'vacant' %}success{% else %}error{% endif %}">
          {{ status }}
        </p>
      </article>
    </section>
  </main>
</body>
</html>
